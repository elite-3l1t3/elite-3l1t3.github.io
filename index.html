<!DOCTYPE html>
<html lang="mn"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drop — түр хугацаанд файл түгээх</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--bg:#0e1116;--card:#171b23;--line:#272d38;--tx:#eaeef5;--mu:#8b95a7;--ac:#5eead4;--ac2:#818cf8;--bad:#f87171;color-scheme:dark}
@media(prefers-color-scheme:light){:root{--bg:#f4f6fa;--card:#fff;--line:#dde2ea;--tx:#141922;--mu:#5d687a;--ac:#0d9488;--ac2:#4f46e5;--bad:#dc2626;color-scheme:light}}
*{box-sizing:border-box;margin:0}html{-webkit-text-size-adjust:100%}
body{font:16px/1.5 Manrope,system-ui,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh}
body:before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(600px 400px at 85% -5%,color-mix(in srgb,var(--ac2) 28%,transparent),transparent),radial-gradient(500px 380px at -5% 105%,color-mix(in srgb,var(--ac) 20%,transparent),transparent)}
nav{display:flex;align-items:center;gap:6px;padding:12px max(16px,env(safe-area-inset-right)) 12px max(16px,env(safe-area-inset-left));padding-top:max(12px,env(safe-area-inset-top));max-width:920px;margin:auto;flex-wrap:wrap}
.logo{font-weight:800;font-size:22px;margin-right:auto;color:var(--tx);text-decoration:none}.logo i{font-style:normal;color:var(--ac)}
nav a.l{color:var(--mu);text-decoration:none;padding:8px 12px;border-radius:10px;font-weight:600;font-size:14px}nav a.l:hover{color:var(--tx);background:var(--card)}
main{max-width:920px;margin:auto;padding:12px 16px 80px}
h1{font-size:clamp(34px,7vw,60px);line-height:1.05;font-weight:800;letter-spacing:-.03em}
.sub{color:var(--mu);margin:14px 0 26px;max-width:520px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:16px}
.grid{display:grid;gap:16px;grid-template-columns:1fr 1fr}@media(max-width:700px){.grid{grid-template-columns:1fr}}
input,select,textarea{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit;margin:6px 0 12px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--ac)}
label{font-size:13px;color:var(--mu);font-weight:600}
button,.btn{display:inline-block;border:0;border-radius:12px;padding:12px 20px;font:inherit;font-weight:800;cursor:pointer;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#06121a;text-decoration:none;transition:transform .15s,opacity .15s;touch-action:manipulation}
button:hover,.btn:hover{transform:translateY(-2px)}button:active{transform:scale(.97)}button:disabled{opacity:.5;pointer-events:none}
button.g{background:var(--bg);color:var(--tx);border:1px solid var(--line)}button.d{background:var(--bad);color:#fff}button.s{padding:7px 12px;font-size:13px}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.drop{border:2px dashed var(--line);border-radius:16px;padding:30px 16px;text-align:center;color:var(--mu);cursor:pointer;transition:border-color .2s,transform .2s;display:block}
.drop:hover,.drop.on{border-color:var(--ac);transform:scale(1.01)}.drop b{color:var(--tx);display:block;word-break:break-all}
.row{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line);flex-wrap:wrap}.row:first-child{border-top:0}
.row .n{flex:1;min-width:140px;word-break:break-all}.row small{display:block;color:var(--mu)}
.tag{font-size:12px;padding:3px 9px;border-radius:99px;background:var(--bg);border:1px solid var(--line);color:var(--mu)}
.tabs{display:flex;gap:6px;margin-bottom:14px}.tabs button{flex:1}
.bar{height:5px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:12px}.bar i{display:block;height:100%;width:35%;background:var(--ac);border-radius:9px;animation:sl 1s linear infinite}
@keyframes sl{from{transform:translateX(-100%)}to{transform:translateX(300%)}}
.v{animation:in .35s ease-out both}@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.st{color:#fbbf24;letter-spacing:2px}.stars button{background:none;color:var(--mu);padding:0 3px;font-size:28px;border-radius:6px}.stars button.on{color:#fbbf24}
#toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom));transform:translate(-50%,30px);background:var(--card);border:1px solid var(--line);padding:12px 18px;border-radius:12px;opacity:0;transition:.25s;pointer-events:none;z-index:9;max-width:90vw}
#toast.show{opacity:1;transform:translate(-50%,0)}#toast.err{border-color:var(--bad)}
.big{text-align:center;padding:34px 20px}.big h2{word-break:break-all;margin:10px 0 4px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<nav><a class="logo" href="#/">Drop<i>.</i></a><a class="l" href="#/">Нүүр</a><a class="l" href="#/reviews">Сэтгэгдэл</a><span id="nv"></span></nav>
<main id="app"></main><div id="toast"></div>
<script>
// ====== ТОХИРГОО: Supabase Project Settings > API-аас авна ======
const SB_URL='https://ubdotcizebfiejzyuwrd.supabase.co', SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InViZG90Y2l6ZWJmaWVqenl1d3JkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIwNzE5ODMsImV4cCI6MjEwNzY0Nzk4M30.rqA7t4UjULy4uByyv4dG8yCbPTjFM5Gm8lxn8XxwiRQ';
// =================================================================
const sb=supabase.createClient(SB_URL,SB_KEY,{auth:{flowType:'pkce'}}),$=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=b=>b<1048576?Math.max(1,b/1024|0)+' KB':(b/1048576).toFixed(1)+' MB';
let me=null,prof=null,tm;
function toast(m,e){const t=$('#toast');t.textContent=m;t.className='show'+(e?' err':'');clearTimeout(tm);tm=setTimeout(()=>t.className='',3200)}
function left(d){const s=(new Date(d)-Date.now())/1000;if(s<=0)return'дууссан';if(s<3600)return(s/60|0)+' мин';if(s<86400)return(s/3600|0)+' цаг';return(s/86400|0)+' хоног'}
const ok=()=>prof&&prof.status==='approved'&&prof.role!=='guest',url=s=>location.origin+location.pathname+'#/s/'+s;
async function boot(){const{data:{session}}=await sb.auth.getSession();await setUser(session?.user)}
async function setUser(u){me=u||null;prof=null;if(me){const{data}=await sb.from('profiles').select('*').eq('id',me.id).maybeSingle();prof=data;if(!prof){await sb.auth.signOut();me=null}}
 $('#nv').innerHTML=(prof?.role==='admin'?'<a class="l" href="#/admin">Админ</a>':'')+(me?'<a class="l" href="#" id="lo">Гарах</a>':'');
 if(me)$('#lo').onclick=async e=>{e.preventDefault();await sb.auth.signOut();await setUser();route()};route()}
function route(){const h=location.hash.slice(2).split('/');const f=h[0]==='s'?()=>dl(h[1]):h[0]==='admin'?admin:h[0]==='reviews'?reviews:home;
 app.innerHTML='';const d=document.createElement('div');d.className='v';app.appendChild(d);f(d)}
addEventListener('hashchange',route);

function home(d){
 if(!me)return authView(d);
 if(!prof)return d.innerHTML='<div class="card big"><p>Профайл олдсонгүй. Дахин нэвтэрнэ үү.</p></div>';
 if(prof.status==='pending')return d.innerHTML='<div class="card big"><h2>Хүсэлт хүлээгдэж байна</h2><p class="sub" style="margin:8px auto 0">Админ таны хүсэлтийг шалгаад зөвшөөрмөгц файл түгээх боломжтой болно.</p></div>';
 if(prof.status==='rejected')return d.innerHTML='<div class="card big"><h2>Хүсэлт татгалзагдсан</h2></div>';
 const g=prof.role==='guest';
 d.innerHTML=`<h1>Файлаа илгээ.<br>Хугацаа дуусахад алга болно.</h1><p class="sub">Линк үүсгээд хуваалц. Сонгосон хугацаанд л хадгалагдаж, дараа нь бүрмөсөн устна.</p>
 ${g?'<p class="sub" style="margin-top:0">Зочин: 1 файл, 20MB хүртэл. Хугацаа дуусахад бүртгэл файлтайгаа хамт устна.</p>':''}<div class="card" id="upc"><label class="drop" id="dz"><input type="file" id="file" hidden><span id="fn">Файлаа энд чирж оруул эсвэл дарж сонго<br><small>Дээд тал нь ${g?20:50}MB</small></span></label>
 <div class="grid" style="margin-top:14px"><div><label>Хэдэн хугацаанд хадгалах вэ</label><select id="ex">${g?[1,2,3,5,7].map(n=>`<option value="${n*24}">${n} өдөр</option>`).join(''):'<option value="1">1 цаг</option><option value="6">6 цаг</option><option value="24" selected>1 өдөр</option><option value="72">3 хоног</option><option value="168">7 хоног</option>'}</select></div>
 <div><label>Линкийн нэр (хоосон бол санамсаргүй)</label><input id="slug" placeholder="my-file" maxlength="30" autocapitalize="off"></div></div>
 <button id="up" style="width:100%">Линк үүсгэх</button><div id="pg"></div></div>
 <div class="card"><b>Миний файлууд</b><div id="my" style="margin-top:8px"></div></div>`;
 const dz=$('#dz'),fi=$('#file'),show=()=>{if(fi.files[0])$('#fn').innerHTML='<b>'+esc(fi.files[0].name)+'</b>'+fmt(fi.files[0].size)};
 fi.onchange=show;['dragover','dragenter'].forEach(e=>dz.addEventListener(e,x=>{x.preventDefault();dz.classList.add('on')}));
 ['dragleave','drop'].forEach(e=>dz.addEventListener(e,x=>{x.preventDefault();dz.classList.remove('on')}));
 dz.addEventListener('drop',x=>{if(x.dataTransfer.files[0]){fi.files=x.dataTransfer.files;show()}});
 $('#up').onclick=upload;myFiles()}
async function upload(){const f=$('#file').files[0];if(!f)return toast('Эхлээд файл сонгоно уу',1);const lim=prof.role==='guest'?20:50;if(f.size>lim*1048576)return toast('Файл '+lim+'MB-аас хэтэрсэн байна',1);
 const slug=($('#slug').value.trim().toLowerCase())||Math.random().toString(36).slice(2,8);
 if(!/^[a-z0-9-]{3,30}$/.test(slug))return toast('Нэр: a-z, 0-9, "-" тэмдэгт, 3–30 урттай байх ёстой',1);
 const b=$('#up');b.disabled=true;$('#pg').innerHTML='<div class="bar"><i></i></div>';
 const path=me.id+'/'+crypto.randomUUID()+'_'+f.name.replace(/[^\w.-]/g,'_');
 const u=await sb.storage.from('files').upload(path,f,{contentType:f.type||'application/octet-stream'});
 if(u.error){b.disabled=false;$('#pg').innerHTML='';return toast('Upload амжилтгүй: '+u.error.message,1)}
 const r=await sb.from('files').insert({owner:me.id,name:f.name,size:f.size,path,slug,expires_at:new Date(Date.now()+$('#ex').value*36e5).toISOString()}).select('id').single();
 b.disabled=false;$('#pg').innerHTML='';
 if(r.error){await sb.storage.from('files').remove([path]);return toast(r.error.code==='23505'?'Энэ нэр аль хэдийн авагдсан':'Хязгаар хэтэрсэн (зочин 1 файл, гишүүн 20 файл / 250MB) эсвэл алдаа гарлаа',1)}
 sb.functions.invoke('drop',{body:{action:'backup',id:r.data.id}});try{await navigator.clipboard.writeText(url(slug))}catch(e){}
 toast('Линк бэлэн боллоо, хуулагдсан');$('#file').value='';$('#fn').innerHTML='Файлаа энд чирж оруул эсвэл дарж сонго';myFiles()}
async function myFiles(){const{data}=await sb.from('files').select('*').eq('owner',me.id).gt('expires_at',new Date().toISOString()).order('created_at',{ascending:false});
 const el=$('#my');if(!el)return;if(prof.role==='guest'&&data?.length)$('#upc').style.display='none';if(!data?.length)return el.innerHTML='<p class="sub" style="margin:8px 0 0">Идэвхтэй файл алга. Дээрээс эхний файлаа оруулаарай.</p>';
 el.innerHTML=data.map(f=>`<div class="row"><div class="n">${esc(f.name)}<small>${fmt(f.size)} · ${left(f.expires_at)} үлдсэн · ${f.downloads} татсан</small></div><button class="g s" data-c="${esc(f.slug)}">Хуулах</button><button class="d s" data-d="${f.id}" data-p="${esc(f.path)}">Устгах</button></div>`).join('');
 el.onclick=async e=>{const t=e.target;if(t.dataset.c){try{await navigator.clipboard.writeText(url(t.dataset.c));toast('Хуулагдлаа')}catch(x){prompt('Линк:',url(t.dataset.c))}}
  if(t.dataset.d&&confirm('Энэ файлыг бүрмөсөн устгах уу?')){await sb.functions.invoke('drop',{body:{action:'remove',id:t.dataset.d}});await sb.storage.from('files').remove([t.dataset.p]);await sb.from('files').delete().eq('id',t.dataset.d);myFiles()}}}

function authView(d){let reg=false;
 d.innerHTML=`<h1>Файл түгээх<br>хамгийн энгийн арга.</h1><p class="sub">Нэвтэрч файлаа оруул, богино линкээр хуваалц. Хугацаа дуусахад файл бүрмөсөн устна.</p>
 <div class="card" style="max-width:420px"><button id="dc" style="width:100%;margin-bottom:10px">Discord-оор үргэлжлүүлэх</button><button class="g" id="gs" style="width:100%;margin-bottom:16px">Зочноор орох (бүртгэлгүй)</button><div class="tabs"><button class="s" id="t1">Нэвтрэх</button><button class="g s" id="t2">Хүсэлт илгээх</button></div>
 <label>Имэйл</label><input id="em" type="email" autocomplete="email"><label>Нууц үг (6+ тэмдэгт)</label><input id="pw" type="password" autocomplete="current-password">
 <button id="go" style="width:100%">Нэвтрэх</button></div>`;
 const set=r=>{reg=r;$('#t1').className=r?'g s':'s';$('#t2').className=r?'s':'g s';$('#go').textContent=r?'Хүсэлт илгээх':'Нэвтрэх'};
 $('#dc').onclick=()=>sb.auth.signInWithOAuth({provider:'discord',options:{redirectTo:location.origin+location.pathname}});
 $('#gs').onclick=async()=>{$('#gs').disabled=true;const r=await sb.auth.signInAnonymously();$('#gs').disabled=false;r.error?toast('Зочноор орох боломжгүй: '+r.error.message,1):setUser(r.data.user)};
 $('#t1').onclick=()=>set(false);$('#t2').onclick=()=>set(true);
 $('#go').onclick=async()=>{const e=$('#em').value.trim(),p=$('#pw').value;if(!e||p.length<6)return toast('Имэйл болон 6+ тэмдэгттэй нууц үг оруулна уу',1);
  $('#go').disabled=true;const r=reg?await sb.auth.signUp({email:e,password:p}):await sb.auth.signInWithPassword({email:e,password:p});$('#go').disabled=false;
  if(r.error)return toast(r.error.message,1);
  if(!r.data.session)return toast('Бүртгэл үүслээ. Имэйлээ баталгаажуулаад нэвтэрнэ үү.');
  toast(reg?'Хүсэлт илгээгдлээ':'Тавтай морил');setUser(r.data.session.user)}}

async function dl(slug){const d=app.firstChild;d.innerHTML='<div class="card big"><p class="sub" style="margin:0">Ачаалж байна…</p></div>';
 const{data}=await sb.rpc('get_file',{p_slug:slug});const f=data&&data[0];
 if(!f)return d.innerHTML='<div class="card big"><h2>Файл олдсонгүй</h2><p class="sub" style="margin:8px auto 0">Линк буруу эсвэл хугацаа нь дууссан тул файл устсан байна.</p></div>';
 const u=sb.storage.from('files').getPublicUrl(f.path,{download:f.name}).data.publicUrl;
 d.innerHTML=`<div class="card big"><span class="tag">${left(f.expires_at)} үлдсэн</span><h2>${esc(f.name)}</h2><p class="sub" style="margin:0 auto 22px">${fmt(f.size)} · ${f.downloads} удаа татсан</p><a class="btn" id="dlb" href="${esc(u)}">Татаж авах</a></div>`;
 $('#dlb').onclick=()=>sb.rpc('hit',{p_slug:slug})}

async function admin(d){if(prof?.role!=='admin')return d.innerHTML='<div class="card big"><h2>Зөвшөөрөл байхгүй</h2></div>';
 const{data}=await sb.from('profiles').select('*').neq('role','guest').order('created_at',{ascending:false});
 const o={pending:0,approved:1,rejected:2};data.sort((a,b)=>o[a.status]-o[b.status]);
 const lb={pending:'Хүлээгдэж буй',approved:'Зөвшөөрсөн',rejected:'Татгалзсан'};
 d.innerHTML=`<h1 style="font-size:36px">Гишүүд</h1><div class="card" style="margin-top:18px">`+data.map(p=>`<div class="row"><div class="n">${esc(p.email||p.name)}<small>${p.role==='admin'?'Админ (байнгын)':lb[p.status]}</small></div>${p.role==='admin'?'':`<button class="s" data-a="${p.id}" data-s="approved">Зөвшөөрөх</button><button class="d s" data-a="${p.id}" data-s="rejected">Татгалзах</button>`}</div>`).join('')+'</div>';
 d.onclick=async e=>{const t=e.target;if(t.dataset.a){const r=await sb.from('profiles').update({status:t.dataset.s}).eq('id',t.dataset.a);r.error?toast(r.error.message,1):(toast('Хадгалагдлаа'),route())}}}

async function reviews(d){const{data}=await sb.from('reviews').select('*').order('created_at',{ascending:false}).limit(50);let rt=5;
 d.innerHTML=`<h1 style="font-size:36px">Сэтгэгдэл</h1><div class="card" style="margin-top:18px">${ok()?`<div class="stars" id="st">${[1,2,3,4,5].map(i=>`<button class="on" data-r="${i}">★</button>`).join('')}</div><textarea id="bd" rows="3" maxlength="300" placeholder="Сэтгэгдлээ бичнэ үү"></textarea><button id="rs">Илгээх</button>`:'<p class="sub" style="margin:0">Сэтгэгдэл бичихийн тулд зөвшөөрөгдсөн гишүүн байх шаардлагатай.</p>'}</div><div class="card">${data?.length?data.map(r=>`<div class="row"><div class="n"><span class="st">${'★'.repeat(r.rating)}${'☆'.repeat(5-r.rating)}</span> ${esc(r.name)}<small style="color:var(--tx)">${esc(r.body)}</small></div>${me&&(r.user_id===me.id||prof?.role==='admin')?`<button class="g s" data-x="${r.id}">Устгах</button>`:''}</div>`).join(''):'<p class="sub" style="margin:0">Сэтгэгдэл алга байна. Анхных нь болоорой.</p>'}</div>`;
 const st=$('#st');if(st)st.onclick=e=>{if(e.target.dataset.r){rt=+e.target.dataset.r;[...st.children].forEach((b,i)=>b.classList.toggle('on',i<rt))}};
 const rs=$('#rs');if(rs)rs.onclick=async()=>{const b=$('#bd').value.trim();if(!b)return toast('Сэтгэгдлээ бичнэ үү',1);rs.disabled=true;
  const r=await sb.from('reviews').insert({user_id:me.id,name:prof.name,rating:rt,body:b});r.error?(toast(r.error.message,1),rs.disabled=false):(toast('Баярлалаа'),route())};
 d.addEventListener('click',async e=>{if(e.target.dataset.x){await sb.from('reviews').delete().eq('id',e.target.dataset.x);route()}})}
sb.auth.onAuthStateChange((ev)=>{if(ev==='SIGNED_OUT')setUser()});
boot();
</script></body></html>
